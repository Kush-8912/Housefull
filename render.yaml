# Render Blueprint: one Node web service that serves both the API and the
# built React client (single origin). MongoDB is hosted on MongoDB Atlas.
services:
  - type: web
    name: housefull
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false # set in the Render dashboard (Atlas connection string)
      - key: JWT_SECRET
        generateValue: true
      - key: TICKET_SIGNING_SECRET
        generateValue: true
      - key: HOLD_TTL_MINUTES
        value: "8"
      - key: APP_URL
        sync: false # your Render URL, for links in emails
      - key: SMTP_URL
        sync: false # optional: SMTP credentials to actually send email
      - key: MAIL_FROM
        sync: false # the address emails come from, e.g. Housefull <housefull.tickets@gmail.com>
      - key: GOOGLE_CLIENT_ID
        sync: false # optional: turns on "Continue with Google"
      - key: ANTHROPIC_API_KEY
        sync: false # optional: Claude writes reminder emails, feedback questions and insights
